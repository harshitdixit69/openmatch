<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset your OpenMatch password</title>
  </head>
  <body style="margin:0;padding:0;background-color:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f6f8;padding:32px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="440" cellspacing="0" cellpadding="0" style="background-color:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(17,49,60,0.08);">
            <tr>
              <td style="background-color:#11313c;padding:28px 32px;text-align:center;">
                <span style="color:#ffffff;font-size:22px;font-weight:700;letter-spacing:0.5px;">OpenMatch</span>
              </td>
            </tr>
            <tr>
              <td style="padding:36px 32px 8px 32px;text-align:center;">
                <h1 style="margin:0;color:#11313c;font-size:20px;font-weight:700;">Reset your password</h1>
                <p style="margin:12px 0 0 0;color:#5a6b72;font-size:14px;line-height:22px;">
                  Enter this 6-digit code in the app to reset your password.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px;text-align:center;">
                <div style="display:inline-block;background-color:#f0f7f5;border:1px solid #d7e6e2;border-radius:12px;padding:18px 28px;">
                  <span style="color:#11313c;font-size:34px;font-weight:700;letter-spacing:10px;">{{ .Token }}</span>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 8px 32px;text-align:center;">
                <p style="margin:0;color:#8a969b;font-size:12px;line-height:20px;">
                  This code expires in 60 minutes. If you didn't request a password reset, you can safely ignore this email.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 32px 32px;text-align:center;border-top:1px solid #eef1f3;">
                <p style="margin:0;color:#b0b9bd;font-size:11px;">
                  &copy; OpenMatch &middot; Fair matchmaking. AI-first.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
